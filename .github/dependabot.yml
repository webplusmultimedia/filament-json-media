version: 2

updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    # Laisse passer 7 jours avant de proposer une version fraîchement publiée :
    # les paquets compromis sont presque toujours dépubliés dans les heures qui suivent.
    cooldown:
      default-days: 7
    groups:
      github-actions:
        patterns:
          - '*'
    commit-message:
      prefix: 'chore(ci)'

  - package-ecosystem: composer
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      php-dev-dependencies:
        dependency-type: development
        patterns:
          - '*'
    commit-message:
      prefix: chore
